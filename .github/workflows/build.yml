name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: test -f dist/index.js
      - name: Smoke test - server starts and lists four tools
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 25 node dist/index.js > smoke.txt || true
          grep -o '"name":"deepfetch_[a-z]*"' smoke.txt | sort -u
          test "$(grep -o '"name":"deepfetch_[a-z]*"' smoke.txt | sort -u | wc -l)" -eq 4
      - name: End-to-end search call over stdio
        run: |
          {
            printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"deepfetch_search","arguments":{"query":"SQLite WAL mode checkpoint","num_results":5}}}'
            sleep 20
          } | timeout 60 node dist/index.js > e2e.txt 2>e2e.err || true
          echo "--- response ---"; head -c 600 e2e.txt; echo; echo "--- stderr ---"; head -c 300 e2e.err
          test "$(grep -o '"url":"https\?://[^"]*"' e2e.txt | wc -l)" -ge 2
